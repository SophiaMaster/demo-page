<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>KursPortal – Entdecken. Lernen. Weiterkommen.</title>
<style>
:root{--blue:#2358cb;--navy:#152c55;--ink:#253552;--muted:#6c7890;--line:#e3e8f0;--bg:#f6f8fb;--size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:var(--size)/1.55 system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,select{font:inherit}button,a{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1160px;margin:auto;padding:0 26px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.bar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:22px}.logo{font-weight:850;letter-spacing:-.7px;font-size:25px;color:var(--navy)}.logo span{color:#3e79ed}.nav{display:flex;align-items:center;gap:25px}.nav a{color:#4c5d78;font-size:14px;font-weight:600}.nav a.on{color:var(--blue)}.pill{border-radius:999px;background:#edf3ff;padding:8px 14px}.banner{background:#eaf0ff;border-bottom:1px solid #dce5ff;text-align:center;font-size:13px;padding:9px;color:#39568b}.hero{background:linear-gradient(118deg,#17346a,#2356bd 64%,#397dde);color:white;padding:82px 0 88px;position:relative;overflow:hidden}.hero:after{content:'◌';position:absolute;font-size:420px;right:7%;top:-180px;opacity:.08}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(37px,5vw,60px);line-height:1.1;max-width:720px;letter-spacing:-2px;margin:20px 0}.hero p{color:#dbe7ff;max-width:570px;font-size:18px}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:12px 21px;font-weight:700;display:inline-block}.btn.white{background:#fff;color:#2254ac}.btn.ghost{background:#eef3fc;color:var(--blue)}.btn.outline{border:1px solid #b7c7e5;background:#fff;color:var(--blue)}.hero .btn{margin-top:18px}.section{padding:49px 0}.section h2,.pagehead h1{font-size:29px;letter-spacing:-.8px;color:#172e59;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 7px 22px #1c39630a}.art{height:165px;background:linear-gradient(135deg,#b5d8f4,#4d7fd4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:56px;position:relative}.art.b{background:linear-gradient(135deg,#ffcfa8,#da7b62)}.art.c{background:linear-gradient(135deg,#b9e6ce,#368d81)}.art.d{background:linear-gradient(135deg,#e4d4f8,#7b69bb)}.art.e{background:linear-gradient(135deg,#f7e4ad,#d69d3e)}.art.f{background:linear-gradient(135deg,#b4e4e8,#408aa6)}.tag{display:inline-block;background:#ecf2ff;color:#315ea9;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:800}.inside{padding:21px}.inside h3{font-size:20px;margin:13px 0 8px;color:#19325c}.inside p{font-size:14px;color:var(--muted);min-height:48px}.meta{display:flex;gap:13px;flex-wrap:wrap;color:#61718c;font-size:13px;margin:15px 0;border-top:1px solid var(--line);padding-top:14px}.actions{display:flex;justify-content:space-between;gap:9px;align-items:center}.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;padding:6px}.ad{padding:26px;background:#fff;border:1px solid var(--line);border-radius:15px}.ad h3{margin:0 0 5px}.pagehead{padding:46px 0 15px}.toolbar{background:white;border:1px solid var(--line);padding:20px;border-radius:14px;margin:18px 0 23px}.search{width:100%;padding:13px 15px;border:1px solid #cbd5e3;border-radius:9px}.filters{margin-top:15px}.filters summary{cursor:pointer;color:#3e5c96;font-weight:700}.filterrow{display:flex;gap:12px;margin-top:13px}.filterrow select{padding:9px;border:1px solid #cbd5e3;border-radius:9px;background:white}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:30px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:27px;margin-bottom:18px}.panel h2{font-size:23px;color:var(--navy)}.small{font-size:13px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:750;color:#3e4e69}.field input,.field select,.field textarea{padding:12px;border:1px solid #cbd5e3;border-radius:9px;background:white;min-width:0}.field textarea{min-height:105px}.notice{border-radius:10px;padding:15px;background:#edf3ff;color:#354d7d;margin:15px 0}.error{background:#fff0ee;color:#a33328}.success{background:#e7f7ee;color:#226947}.footer{background:#172944;color:#bbcae0;margin-top:60px;padding:44px 0}.footflex{display:flex;justify-content:space-between;gap:30px}.footer a{color:#e9f2ff}.mutelink{font-size:13px;color:#667998}.compact .card .inside{padding:12px}.compact .card .meta{margin:7px 0}.progress{display:flex;gap:10px;margin:17px 0}.step{background:#eaf0fa;padding:8px 12px;border-radius:20px;font-size:12px;color:#546587}.step.current{background:#295fc5;color:white}.star{border:0;background:#f0f4fa;color:#284d85;border-radius:9px;font-size:23px;padding:5px 13px}.tiny{font-size:12px}.right{text-align:right}.extra-data{margin-top:28px;font-size:14px;color:#4b6287}.extra-data summary{font-weight:700;cursor:pointer}hr{border:0;border-top:1px solid var(--line);margin:22px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{gap:11px;flex-wrap:wrap}.bar{height:auto;padding-top:14px;padding-bottom:14px;align-items:flex-start;flex-direction:column}.hero{padding:55px 0}.footflex{flex-direction:column}}@media(max-width:540px){.grid,.formgrid{grid-template-columns:1fr}.wrap{padding:0 17px}.nav a{font-size:12px}.filterrow{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const courses=[
{id:1,title:'Projektmanagement kompakt',cat:'Beruf & Karriere',icon:'▤',color:'a',price:149,dur:'6 UE à 45 Min.',level:'Einsteiger',code:'PM-204',desc:'Entwickeln Sie belastbare Projektstrukturen durch agile Methoden, Stakeholder-Mapping und asynchrone Lerneinheiten.',goal:'Projekte planen, Prioritäten festlegen und Teams koordinieren.',dates:['12.11.2026','26.11.2026']},
{id:2,title:'Fotografie mit dem Smartphone',cat:'Kreativität',icon:'◉',color:'b',price:89,dur:'4 UE à 45 Min.',level:'Alle Level',code:'FO-117',desc:'Kreative Bildkomposition, Belichtung und digitale Nachbearbeitung in abwechslungsreichen Praxisphasen.',goal:'Bessere Bilder machen und Motive bewusst gestalten.',dates:['14.11.2026','05.12.2026']},
{id:3,title:'Excel für den Berufsalltag',cat:'Digitales',icon:'▦',color:'c',price:119,dur:'8 UE à 45 Min.',level:'Einsteiger',code:'EX-312',desc:'Professionalisieren Sie Tabellenprozesse mit Zellreferenzen, Funktionslogik und datengestützter Auswertung.',goal:'Tabellen sicher anlegen und einfache Auswertungen erstellen.',dates:['18.11.2026','09.12.2026']},
{id:4,title:'Spanisch für die Reise',cat:'Sprachen',icon:'✳',color:'d',price:109,dur:'10 UE à 45 Min.',level:'A1',code:'SP-208',desc:'Praxisnahe fremdsprachliche Kommunikationssequenzen für verschiedene touristische Handlungskontexte.',goal:'Wichtige Gespräche im Urlaub führen.',dates:['21.11.2026','12.12.2026']},
{id:5,title:'Achtsamkeit im Alltag',cat:'Gesundheit',icon:'✦',color:'e',price:79,dur:'5 UE à 45 Min.',level:'Alle Level',code:'AC-105',desc:'Reflexionsorientierte Transferübungen zur nachhaltigen Integration von Entspannungsroutinen.',goal:'Neue Routinen für entspanntere Tage kennenlernen.',dates:['16.11.2026','07.12.2026']},
{id:6,title:'Grundlagen Webdesign',cat:'Digitales',icon:'⌘',color:'f',price:169,dur:'12 UE à 45 Min.',level:'Einsteiger',code:'WD-405',desc:'Von Layoutsystematik über responsives Design bis zur prototypischen Umsetzung digitaler Interfaces.',goal:'Eine einfache Website konzipieren und umsetzen.',dates:['28.11.2026','15.12.2026']}];
// Lokale Speicherung mit robustem In-Memory-Fallback für Browser, die file:-Storage blockieren.
const kpMemory=Object.create(null);
const kpStorage={
 getItem(key){try{return window.localStorage.getItem(key)}catch(err){return Object.prototype.hasOwnProperty.call(kpMemory,key)?kpMemory[key]:null}},
 setItem(key,value){try{window.localStorage.setItem(key,String(value))}catch(err){kpMemory[key]=String(value)}},
 removeItem(key){try{window.localStorage.removeItem(key)}catch(err){delete kpMemory[key]}}
};
const kpList=key=>{try{const v=JSON.parse(kpStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(err){return []}};
const $=s=>document.querySelector(s);const saved=()=>kpList('kursportal-favs');const bookings=()=>kpList('kursportal-bookings');const course=id=>courses.find(c=>c.id===Number(id))||courses[0];const euro=v=>v.toLocaleString('de-DE')+' €';let search='',category='Alle Bereiche',sort='empfohlen',font=16,compact=false,noticeNo=0,checkDate='',bookingDraft=null,preferredHome=kpStorage.getItem('kursportal-start')||'home';
const path=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);const go=p=>{if(!/^(check|booking|review|done)\//.test(p)){bookingDraft=null;checkDate=''}location.hash='/'+p;window.scrollTo(0,0);render()};
function card(c){const is=saved().includes(c.id);return `<article class="card"><div class="art ${c.color}">${c.icon}</div><div class="inside"><span class="tag">${c.cat}</span><h3>${c.title}</h3><p>${c.goal}</p><div class="meta"><span>◷ ${c.dur}</span><span>◎ ${c.level}</span></div><div class="actions"><strong>${euro(c.price)}</strong><button class="linkbtn" onclick="toggle(${c.id})">${is?'✓ Vorgemerkt':'☆ Merken'}</button></div><div style="margin-top:15px"><button class="btn ghost" onclick="go('course/${c.id}')">Details ansehen →</button></div></div></article>`}
function toggle(id){let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];kpStorage.setItem('kursportal-favs',JSON.stringify(a));render()}
function head(){const seg=path()[0]||'home';return `<header class="top"><div class="wrap bar"><a class="logo" href="#/">Kurs<span>Portal</span><span style="font-size:10px;vertical-align:top;padding-left:5px;color:#8294b3">●</span></a><nav class="nav"><a class="${seg==='home'?'on':''}" href="#/">Startseite</a><a class="${seg==='courses'?'on':''}" href="#/courses">Kurse</a><a class="${seg==='favorites'?'on':''}" href="#/favorites">Meine Auswahl (${saved().length})</a><a href="#/help">Hilfe</a><a class="pill" href="#/settings">⚙ Einstellungen</a></nav></div></header>`}
function banner(){return `<div class="banner" id="ticker">Entdecke neue Perspektiven: ausgewählte Kurse für deinen nächsten Schritt.</div>`}
function home(){return `<div class="hero"><div class="wrap"><span class="eyebrow">Dein Weg zu neuen Möglichkeiten</span><h1>Neue Fähigkeiten.<br>Neue Perspektiven.</h1><p>Entdecke Lernangebote, die zu deinem Alltag passen. Von Kreativität bis Karriere – dein nächster Schritt beginnt hier.</p><button class="btn white" onclick="go('highlights')">Kurse entdecken →</button></div></div><section class="section wrap"><span class="eyebrow" style="color:#5376bd">Für dich ausgewählt</span><h2>Beliebte Kurse</h2><p class="sub">Inspiration für deine nächsten Lernmomente.</p><div class="grid">${courses.slice(0,3).map(card).join('')}</div></section><section class="section wrap"><h2>Wissen, das weiterbringt</h2><div class="grid"><div class="ad"><h3>✦ Dein nächster Karriereschritt</h3><p>Entwickle Kompetenzen, die neue Türen öffnen können.</p></div><div class="ad"><h3>◈ Entdecke deine kreative Seite</h3><p>Neue Ideen, frische Blickwinkel, spannende Themen.</p></div><div class="ad"><h3>✺ Lernen in deinem Tempo</h3><p>Mit verschiedenen Formaten und neuen Impulsen.</p></div></div><p class="right" style="margin-top:26px"><a href="#/courses">Alle Angebote ansehen →</a></p></section>`}
function highlights(){return `<main class="wrap"><div class="pagehead"><span class="eyebrow" style="color:#5474b6">Inspiration & Trends</span><h1>Entdecke, was zu dir passt</h1><p class="sub">Unsere Empfehlungen für einen abwechslungsreichen Lernherbst.</p></div><div class="grid">${courses.slice(2,5).map(card).join('')}</div><section class="section"><p>Du suchst etwas Bestimmtes? <a href="#/courses">Gesamtes Programm ansehen</a></p></section></main>`}
function catalog(){let filtered=courses.filter(c=>(c.title+' '+c.cat).toLowerCase().includes(search.toLowerCase())&&(category==='Alle Bereiche'||c.cat===category));if(sort==='price')filtered.sort((a,b)=>a.price-b.price);if(sort==='title')filtered.sort((a,b)=>a.title.localeCompare(b.title));return `<main class="wrap"><div class="pagehead"><span class="eyebrow" style="color:#5376bd">Deine Möglichkeiten</span><h1>Unser Kursangebot</h1><p class="sub">Finde neue Themen, die dich wirklich interessieren.</p></div><div class="toolbar"><input id="q" class="search" placeholder="Nach einem Kurs suchen …" value="${search.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" oninput="search=this.value;updateCatalog()"><details class="filters" id="filterdetails"><summary>☷ Verfeinern</summary><div class="filterrow"><select id="cat" onchange="category=this.value;updateCatalog()">${['Alle Bereiche',...new Set(courses.map(c=>c.cat))].map(x=>`<option ${x===category?'selected':''}>${x}</option>`).join('')}</select><select id="sort" onchange="sort=this.value;updateCatalog()"><option value="empfohlen" ${sort==='empfohlen'?'selected':''}>Empfohlen</option><option value="price" ${sort==='price'?'selected':''}>Preis aufsteigend</option><option value="title" ${sort==='title'?'selected':''}>Alphabetisch</option></select></div></details></div><p class="small">${filtered.length} Ergebnisse</p><div class="grid" id="results">${filtered.map(card).join('')||'<div class="panel">Keine passenden Angebote gefunden.</div>'}</div></main>`}
function updateCatalog(){let active=document.activeElement?.id, caret=active==='q'?$('#q').selectionStart:null,opened=$('#filterdetails')?.open;$('#page').innerHTML=catalog();if(opened)$('#filterdetails').open=true;if(active==='q'){let q=$('#q');q.focus();q.setSelectionRange(caret,caret)}}
function detail(c){return `<main class="wrap"><div class="pagehead"><p class="small"><a href="#/courses">Kurse</a> / ${c.cat}</p><span class="tag">${c.cat}</span><h1>${c.title}</h1><p class="sub">${c.goal}</p></div><div class="layout"><div><div class="art ${c.color}" style="height:290px;border-radius:17px">${c.icon}</div><div class="panel" style="margin-top:22px"><h2>Über diesen Kurs</h2><p>${c.desc}</p><h2>Das erwartet dich</h2><p>Entdecke neue Impulse und erweitere deine Kenntnisse durch abwechslungsreiche Übungen und praxisbezogene Lernphasen. Die Kursorganisation erfolgt im gebuchten Format.</p><h2>Organisatorisches</h2><p>Teilnahmebestätigung nach Abschluss der Lerneinheiten; Materialien je nach Kurskonzept. Weitere Details zum genauen Ablauf werden im Termin-Check angezeigt.</p><p class="small">Referenz: <strong>${c.code}</strong></p><details class="extra-data"><summary>Weitere Angaben zur Organisation</summary><p><strong>Durchführung:</strong> ${c.id%2?'Live-Online-Seminar':'Präsenzkurs im Lernzentrum (fiktiver Ort)'}</p><p><strong>Voraussetzung:</strong> ${c.level==='Einsteiger'?'Keine Vorkenntnisse notwendig':'Grundkenntnisse sind hilfreich'}.</p></details></div></div><aside><div class="panel"><span class="tag">Aktuell buchbar</span><h2>${euro(c.price)}</h2><p>◷ ${c.dur}</p><p>◎ ${c.level}</p><p>◷ Nächster Termin: ${c.dates[0]}</p><hr><button class="btn" style="width:100%" onclick="go('check/${c.id}')">Platz auswählen →</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="toggle(${c.id})">${saved().includes(c.id)?'Vorgemerkt ✓':'☆ Zu Favoriten'}</button><button class="star" title="Auswahl" onclick="toggle(${c.id})" style="margin-top:13px">☆</button></div></aside></div></main>`}
function check(c){return `<main class="wrap"><div class="pagehead"><h1>Termin-Check</h1><p class="sub">Bitte prüfe die verfügbaren Optionen für ${c.title}.</p></div><div class="panel" style="max-width:710px"><div class="progress"><span class="step current">Termin</span><span class="step">Angaben</span><span class="step">Übersicht</span></div><h2>Deine Kursoption</h2><p>${c.title} · ${euro(c.price)}</p><div class="field"><label for="date">Terminvariante wählen</label><select id="date"><option value="">Bitte wählen</option>${c.dates.map((d,i)=>`<option value="${d}">${i===0?'Option A':'Option B'} – ${d}</option>`).join('')}</select></div><button class="btn" onclick="checkDate=$('#date').value;if(!checkDate){$('#checkerr').innerText='Bitte Auswahl prüfen.';return}go('booking/${c.id}')">Weiter →</button><p id="checkerr" class="small"></p></div></main>`}
function booking(c){const d=bookingDraft&&bookingDraft.id===c.id?bookingDraft:{};const ev=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');return `<main class="wrap"><div class="pagehead"><h1>Teilnahme vormerken</h1><p class="sub">Bitte ergänze die erforderlichen Angaben.</p></div><div class="layout"><div class="panel"><div class="progress"><span class="step">Termin</span><span class="step current">Angaben</span><span class="step">Übersicht</span></div><form id="bookingform" novalidate onsubmit="advanceBooking(event,${c.id})"><div class="formgrid"><div class="field"><label for="first">Vorname *</label><input id="first" autocomplete="off" placeholder="Vorname" value="${ev(d.first)}"></div><div class="field"><label for="last">Nachname *</label><input id="last" autocomplete="off" placeholder="Nachname" value="${ev(d.last)}"></div></div><div class="field"><label for="mail">E-Mail-Adresse *</label><input id="mail" placeholder="name@beispiel.de" type="text" autocomplete="off" value="${ev(d.mail)}"></div><div class="formgrid"><div class="field"><label for="birth">Geburtsdatum (TT.MM.JJJJ) *</label><input id="birth" placeholder="TT.MM.JJJJ" autocomplete="off" value="${ev(d.birth)}"></div><div class="field"><label for="coursecode">Referenzkennung *</label><input id="coursecode" placeholder="Kurskennung" autocomplete="off" value="${ev(d.code)}"><button class="linkbtn tiny" type="button" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Was bedeutet Referenzkennung?</button><p hidden class="small">Der alphanumerische Veranstaltungsschlüssel ist dem jeweiligen Angebotskontext zu entnehmen und in identischer Notation zu übertragen.</p></div></div><div class="field"><label for="slot">Geprüfte Terminvariante *</label><select id="slot"><option value="">Variante zuordnen</option><option value="A" ${d.option==='A'?'selected':''}>Option A</option><option value="B" ${d.option==='B'?'selected':''}>Option B</option></select></div><p class="small">Sofern eine Änderung nicht innerhalb der genannten Frist ausgeschlossen ist, kann sie, wenn keine abweichenden Teilnahmebedingungen vorliegen, nach einer zusätzlichen Prüfung erfolgen.</p><div id="bookingerror"></div><p><button class="btn" type="submit">Weiter zur Übersicht →</button> <button class="linkbtn" type="button" onclick="go('course/${c.id}')">Zurück zum Kurs</button></p></form></div><aside><div class="panel"><h2>Deine Auswahl</h2><p>${c.title}</p><p>Teilnahmebeitrag: <strong>${euro(c.price)}</strong></p><p class="small">Simulation: Es wird keine Zahlung ausgelöst. Keine Angaben werden an einen Server übertragen.</p></div></aside></div></main>`}
function validDOB(s){if(!/^\d{2}\.\d{2}\.\d{4}$/.test(s))return false;const [dd,mm,yy]=s.split('.').map(Number),date=new Date(yy,mm-1,dd);return yy>=1900&&yy<=2026&&date.getFullYear()===yy&&date.getMonth()===mm-1&&date.getDate()===dd}
function advanceBooking(e,id){e.preventDefault();const c=course(id),v=k=>$('#'+k).value.trim();const d={id,first:v('first'),last:v('last'),mail:v('mail'),birth:v('birth'),code:v('coursecode'),option:v('slot')};if(!(d.first&&d.last&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.mail)&&validDOB(d.birth)&&d.code===c.code&&['A','B'].includes(d.option))){$('#bookingerror').innerHTML='<p class="notice error">Eingabe unvollständig (E-17).</p>';return}bookingDraft=d;go('review/'+id)}
function escapeHTML(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}
function review(c){const d=bookingDraft;if(!d||d.id!==c.id)return `<main class="wrap"><div class="pagehead"><h1>Teilnahmeübersicht</h1></div><div class="panel"><p>Deine Eingaben sind in dieser Ansicht nicht mehr verfügbar.</p><button class="btn" onclick="go('check/${c.id}')">Zum Termin-Check</button></div></main>`;const date=c.dates[d.option==='A'?0:1];return `<main class="wrap"><div class="pagehead"><h1>Deine Teilnahmeübersicht</h1><p class="sub">Bitte schließe die Anfrage ab.</p></div><div class="layout"><div class="panel"><div class="progress"><span class="step">Termin</span><span class="step">Angaben</span><span class="step current">Übersicht</span></div><h2>Zusammenfassung</h2><p><strong>${c.title}</strong></p><p>${escapeHTML(d.first)} ${escapeHTML(d.last)} · Option ${d.option} / ${date}</p><p>Teilnahmebeitrag: <strong>${euro(c.price)}</strong></p><hr><form id="reviewform" novalidate onsubmit="submitBooking(event,${c.id})"><div class="field"><label for="mail2">E-Mail-Adresse zur Bestätigung erneut eingeben *</label><input id="mail2" placeholder="E-Mail-Adresse" autocomplete="off"></div><label class="tiny"><input type="checkbox" id="agree"> Ich habe die organisatorischen Hinweise zur Kenntnis genommen. *</label><div id="bookingerror"></div><p><button class="btn" type="submit">Anfrage abschließen →</button> <button class="linkbtn" type="button" onclick="go('booking/${c.id}')">Angaben bearbeiten</button></p></form></div><aside><div class="panel"><h2>Gut zu wissen</h2><p class="small">Dies ist eine unverbindliche Simulation. Es erfolgt keine echte Anmeldung, keine Zahlung und kein Nachrichtenversand.</p></div></aside></div></main>`}
function submitBooking(e,id){e.preventDefault();const c=course(id),d=bookingDraft;if(!d||d.id!==id||$('#mail2').value.trim()!==d.mail||!$('#agree').checked){$('#bookingerror').innerHTML='<p class="notice error">Verarbeitung nicht möglich (E-21).</p>';return}const b=bookings();const ref='KP-'+String(b.length+1).padStart(4,'0');b.push({id,ref,date:c.dates[d.option==='A'?0:1],created:new Date().toISOString()});kpStorage.setItem('kursportal-bookings',JSON.stringify(b));bookingDraft=null;checkDate='';go('done/'+ref)}
function done(ref){return `<main class="wrap"><div class="pagehead"><h1>Vielen Dank für deine Anfrage!</h1></div><div class="panel" style="max-width:750px"><div class="notice success"><strong>Die Demo-Vormerkung wurde lokal gespeichert.</strong></div><p>Deine Referenz lautet <strong>${escapeHTML(ref)}</strong>.</p><p>Dies ist ein Forschungsprototyp. Es wurde keine echte Buchung vorgenommen, keine Nachricht verschickt und keine Zahlung durchgeführt.</p><a class="btn" href="#/courses">Weitere Kurse entdecken</a></div></main>`}
function favorites(){let cs=courses.filter(c=>saved().includes(c.id));return `<main class="wrap"><div class="pagehead"><h1>Meine Auswahl</h1><p class="sub">Deine vorgemerkten Angebote auf einen Blick.</p></div>${cs.length?`<div class="grid">${cs.map(card).join('')}</div>`:'<div class="panel">Deine Auswahl ist noch leer. <a href="#/courses">Entdecke Kurse</a>.</div>'}</main>`}
function help(){return `<main class="wrap"><div class="pagehead"><h1>Service & Fragen</h1><p class="sub">Wichtige Informationen rund um unser Kursangebot.</p></div><div class="layout"><div><div class="panel"><h2>Häufig gefragt</h2><details><summary>Wie funktioniert die Anmeldung?</summary><p>Die anmeldebezogenen Daten werden entsprechend dem vorgesehenen Prozess plausibilisiert und im Rahmen der organisatorischen Bearbeitung zugeordnet.</p></details><hr><details><summary>Kann ich eine Vormerkung ändern?</summary><p>Bitte berücksichtige bei Änderungen die jeweilige Kursreferenz. Diese findest du auf der Kursdetailseite.</p></details><hr><details><summary>Wo finde ich weitere Termine?</summary><p>Die Terminauswahl erscheint nach dem entsprechenden Einstieg in den Anfrageprozess.</p></details></div><div class="panel"><h2>Kontaktformular</h2><p class="small">Frage zu unserem Angebot? Schreib uns.</p><div class="field"><label for="topic">Anliegen</label><select id="topic"><option>Allgemeine Anfrage</option><option>Teilnahme</option><option>Unterlagen</option></select></div><div class="field"><label for="msg">Nachricht</label><textarea id="msg"></textarea></div><button class="btn" onclick="$('#helpnote').innerHTML='<div class=\'notice\'>Deine Demo-Anfrage wurde erfasst. Es erfolgt kein Versand.</div>'">Absenden</button><div id="helpnote"></div></div></div><aside><div class="panel"><h2>Gut zu wissen</h2><p>Informationen zu Kursformaten, Veranstaltungsorten und Buchungsbedingungen stehen bei den jeweiligen Angeboten.</p></div></aside></div></main>`}
function settings(){return `<main class="wrap"><div class="pagehead"><h1>Einstellungen</h1><p class="sub">Passe deine persönliche KursPortal-Ansicht an.</p></div><div class="panel" style="max-width:760px"><h2>Darstellung</h2><div class="field"><label for="fontsize">Textgröße</label><select id="fontsize" onchange="font=Number(this.value);document.documentElement.style.setProperty('--size',font+'px')"><option value="16" ${font===16?'selected':''}>Standard</option><option value="18" ${font===18?'selected':''}>Groß</option><option value="20" ${font===20?'selected':''}>Sehr groß</option></select></div><div class="field"><label for="startview">Bevorzugte Startansicht</label><select id="startview" onchange="preferredHome=this.value;kpStorage.setItem('kursportal-start',preferredHome)"><option value="home" ${preferredHome==='home'?'selected':''}>Startseite</option><option value="courses" ${preferredHome==='courses'?'selected':''}>Kursübersicht</option></select></div><label><input type="checkbox" ${compact?'checked':''} onchange="compact=this.checked;document.body.classList.toggle('compact',compact)"> Einfache Ansicht</label><hr><h2>Deine Daten</h2><p class="small">Favoriten und Demo-Vormerkungen werden in diesem Browser gespeichert.</p><button class="btn outline" onclick="if(confirm('Lokale Demo-Daten löschen?')){kpStorage.removeItem('kursportal-favs');kpStorage.removeItem('kursportal-bookings');render()}">Lokale Daten löschen</button></div></main>`}
function footer(){return `<footer class="footer"><div class="wrap footflex"><div><div class="logo" style="color:#fff">Kurs<span>Portal</span></div><p>Entdecken. Lernen. Weiterkommen.</p><p class="tiny">Offline-Demonstrator für wissenschaftliche Nutzertests.</p></div><div><strong>Informationen</strong><p><a href="#/help">Service & Hilfe</a></p><p><a href="#/settings">Einstellungen</a></p><p><a href="#/courses">Programm</a></p></div><div><strong>Hinweis</strong><p class="tiny">Keine echten Kursplätze, Zahlungen oder Bestätigungen.</p></div></div></footer>`}
function render(){const p=path(),seg=p[0]||'home';document.getElementById('app').innerHTML=head()+banner()+`<div id="page">${seg==='home'?home():seg==='highlights'?highlights():seg==='courses'?catalog():seg==='course'?detail(course(p[1])):seg==='check'?check(course(p[1])):seg==='booking'?booking(course(p[1])):seg==='review'?review(course(p[1])):seg==='done'?done(p[1]):seg==='favorites'?favorites():seg==='help'?help():seg==='settings'?settings():home()}</div>`+footer();document.body.classList.toggle('compact',compact);document.documentElement.style.setProperty('--size',font+'px');document.title='KursPortal – '+({home:'Startseite',courses:'Kurse',favorites:'Meine Auswahl',help:'Hilfe',settings:'Einstellungen',booking:'Vormerkung'}[seg]||'Kursangebote')}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();const notices=['Entdecke neue Perspektiven: ausgewählte Kurse für deinen nächsten Schritt.','Neu im Programm: kreative Workshops für deinen Alltag.','Jetzt entdecken: spannende Themen rund um Beruf und Freizeit.'];setInterval(()=>{let el=$('#ticker');if(el){noticeNo=(noticeNo+1)%notices.length;el.textContent=notices[noticeNo]}},6000);

</script>
</body>
</html>
